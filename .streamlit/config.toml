[theme]
base = "light"
font = "sans-serif"

[theme.light]
primaryColor = "#7C3AED"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#EEF2FF"
textColor = "#172554"
borderColor = "#D8DDF5"

[theme.dark]
primaryColor = "#A78BFA"
backgroundColor = "#0F172A"
secondaryBackgroundColor = "#1E293B"
textColor = "#E2E8F0"
borderColor = "#334155"

[client]
toolbarMode = "auto"
